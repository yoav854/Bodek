<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>סטטיסטיקת הבודק</title>
<style>
  /* דף פרטי: סיכום למעלה, השוואה חודשית למטה */
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d232b; --muted:#5d6874; --line:#dde2e8; --accent:#1f6feb; --gap:#c2410c; --ok:#15803d; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1318; --card:#171c23; --fg:#e7ecf1; --muted:#9aa5b1; --line:#2a323c; --accent:#5a9bff; --gap:#fb923c; --ok:#4ade80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; line-height:1.5; }
  main { max-width: 760px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:20px; }
  h1 { margin:0; font-size:1.6rem; text-wrap: balance; }
  .sub { margin:0; color:var(--muted); font-size:.95rem; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:4px; }
  .tile .lbl { color:var(--muted); font-size:.85rem; }
  .tile .val { font-size:1.9rem; font-weight:700; font-variant-numeric: tabular-nums; }
  .tile.gap .val { color:var(--gap); }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  h2 { margin:0; font-size:1.1rem; }
  .chart { overflow-x:auto; }
  svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
  table { width:100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.85rem; }
  .login { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input { flex:1 1 220px; min-width:0; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; direction:ltr; }
  button { padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.link { background:none; color:var(--accent); padding:0; font-weight:400; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .err { color:var(--gap); margin:0; }
  .note { color:var(--muted); font-size:.85rem; margin:0; }
</style>
</head>
<body>
<main>
  <div>
    <h1>סטטיסטיקת הבודק</h1>
    <p class="sub">בדיקות אמיתיות בלבד, תלוש אחד נספר פעם אחת. "כסף חסר" לא כולל מס הכנסה וביטוח לאומי.</p>
  </div>

  <section id="loginBox" hidden>
    <h2>כניסה</h2>
    <form class="login" id="loginForm">
      <label for="tok" class="note" style="flex-basis:100%">הקוד הסודי (נשמר רק במכשיר הזה)</label>
      <input id="tok" type="password" autocomplete="off" required>
      <button type="submit">הצג</button>
    </form>
    <p class="err" id="err" hidden></p>
  </section>

  <div id="data" hidden>
    <div class="tiles">
      <div class="tile"><span class="lbl">בדיקות</span><span class="val" id="tChecks">0</span></div>
      <div class="tile gap"><span class="lbl">נמצאה שגיאה</span><span class="val" id="tGaps">0</span><span class="note" id="tRate"></span></div>
      <div class="tile gap"><span class="lbl">כסף חסר שנמצא</span><span class="val" id="tMoney">0 ₪</span></div>
    </div>
    <section style="margin-top:20px">
      <h2>כסף חסר לפי חודש התלוש</h2>
      <div class="chart" id="chart"></div>
      <table><thead><tr><th>חודש</th><th>בדיקות</th><th>עם שגיאה</th><th>כסף חסר</th></tr></thead><tbody id="rows"></tbody></table>
    </section>
    <p class="note" style="margin-top:12px">עודכן: <span id="when"></span> · <button class="link" id="refresh" type="button">רענן</button> · <button class="link" id="logout" type="button">התנתק</button></p>
  </div>
</main>
<script>
const URL_ = 'https://hwzvmmpkhgrtkbjdojir.supabase.co/rest/v1/rpc/get_stats';
const KEY = 'sb_publishable_RIUtKFbtioKIwhNtPebgmg_QMjfUR17';
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('he-IL', {maximumFractionDigits: 2, minimumFractionDigits: 0});
const MONTHS = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const mLabel = d => { const [y, m] = d.split('-'); return `${MONTHS[+m - 1]} ${y.slice(2)}`; };
const store = { get(){ try { return localStorage.getItem('bodekStatsToken') || ''; } catch(e){ return ''; } }, set(v){ try { v ? localStorage.setItem('bodekStatsToken', v) : localStorage.removeItem('bodekStatsToken'); } catch(e){} } };
let token = store.get();

async function load(){
  $('err').hidden = true;
  try {
    const r = await fetch(URL_, {method:'POST', headers:{apikey: KEY, 'Content-Type':'application/json'}, body: JSON.stringify({p_token: token})});
    if (!r.ok) throw new Error(r.status === 400 || r.status === 403 ? 'bad' : 'net');
    render(await r.json());
    $('loginBox').hidden = true; $('data').hidden = false;
  } catch(e){
    $('data').hidden = true; $('loginBox').hidden = false;
    if (token){ $('err').textContent = e.message === 'bad' ? 'הקוד לא נכון. בדוק אותו ונסה שוב.' : 'אין חיבור לשרת. נסה שוב בעוד רגע.'; $('err').hidden = false; }
    if (e.message === 'bad'){ token = ''; store.set(''); }
  }
}

function render(s){
  const total = +s.total_checks, gaps = +s.checks_with_gap;
  $('tChecks').textContent = nf.format(total);
  $('tGaps').textContent = nf.format(gaps);
  $('tRate').textContent = total ? `${Math.round(gaps / total * 100)}% מהבדיקות` : '';
  $('tMoney').textContent = nf.format(+s.missing_total) + ' ₪';
  const M = s.monthly || [];
  $('rows').innerHTML = M.length ? M.map(m => `<tr><td>${mLabel(m.payslip_month)}</td><td>${m.checks}</td><td>${m.checks_with_gap}</td><td>${nf.format(+m.missing_total)} ₪</td></tr>`).join('')
    : '<tr><td colspan="4" class="note">עוד אין בדיקות. השורה הראשונה תופיע כאן אחרי הבדיקה האמיתית הראשונה.</td></tr>';
  $('chart').innerHTML = M.length ? bars(M) : '';
  $('when').textContent = new Date().toLocaleString('he-IL', {dateStyle:'short', timeStyle:'short'});
}

function bars(M){
  const W = Math.max(320, M.length * 64), H = 180, top = 22, bottom = 26, max = Math.max(...M.map(m => +m.missing_total), 1);
  const bw = Math.min(40, W / M.length * 0.6);
  // מימין לשמאל: החודש הראשון בצד ימין
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="כסף חסר לפי חודש">
    <line x1="0" y1="${H - bottom}" x2="${W}" y2="${H - bottom}" stroke="var(--line)"/>
    ${M.map((m, i) => { const v = +m.missing_total, h = (H - top - bottom) * v / max, cx = W - (i + .5) * W / M.length;
      return `<rect x="${cx - bw / 2}" y="${H - bottom - h}" width="${bw}" height="${h}" rx="4" fill="var(--gap)"/>
        <text x="${cx}" y="${H - bottom - h - 6}" text-anchor="middle">${nf.format(v)}</text>
        <text x="${cx}" y="${H - 8}" text-anchor="middle">${mLabel(m.payslip_month)}</text>`; }).join('')}
  </svg>`;
}

$('loginForm').addEventListener('submit', e => { e.preventDefault(); token = $('tok').value.trim(); store.set(token); $('tok').value = ''; load(); });
$('refresh').addEventListener('click', load);
$('logout').addEventListener('click', () => { token = ''; store.set(''); $('data').hidden = true; $('loginBox').hidden = false; });
token ? load() : ($('loginBox').hidden = false);
</script>
</body>
</html>
