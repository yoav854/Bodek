# בדיקה אוטומטית בכל עדכון: התלושים הפיקטיביים רצים מול הקוד, ואחרי הפרסום גם מול האתר החי.
# כשבדיקה נכשלת, GitHub שולח מייל לבעל המאגר.
# ענף שמתחיל ב-ci- מריץ את הבדיקות בלי לפרסם את האתר (לניסויים בבדיקה עצמה).
name: QA - תלושים פיקטיביים
on:
  push:
    branches: [main, 'ci-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: גרסת כרום
        run: google-chrome --version
      - name: בדיקת הקוד שהועלה
        shell: pwsh
        run: ./qa/run-suite.ps1
      - name: המתנה לפרסום ב-Vercel
        if: always() && github.ref == 'refs/heads/main'
        run: sleep 90
      - name: בדיקת האתר החי
        if: always()
        shell: pwsh
        run: ./qa/run-suite.ps1 -Target live
