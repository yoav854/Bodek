# בדיקה אוטומטית בכל עדכון: התלושים הפיקטיביים רצים מול הקוד, ואחרי הפרסום גם מול האתר החי.
# כשבדיקה נכשלת, GitHub שולח מייל לבעל המאגר.
# ענף שמתחיל ב-ci- מריץ את הבדיקות בלי לפרסם את האתר (לניסויים בבדיקה עצמה).
name: QA - תלושים פיקטיביים
on:
  push:
    branches: [main, 'ci-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: גרסת כרום
        run: google-chrome --version
      - name: בדיקת הקוד שהועלה (הכלי)
        shell: pwsh
        run: ./qa/run-suite.ps1
      - name: בדיקת הקוד שהועלה (דף הכניסה)
        if: always()
        shell: pwsh
        run: ./qa/run-suite.ps1 -PageFile index.html
      - name: בדיקת הקוד שהועלה (דף ניהול העדכונים)
        if: always()
        shell: pwsh
        run: ./qa/run-suite.ps1 -PageFile admin.html
      - name: המתנה לפרסום ב-Vercel
        if: always() && github.ref == 'refs/heads/main'
        # מחכים עד שהאתר החי מגיש בדיוק את check.html (הכלי) מהעדכון (עד 5 דקות), ולא סתם 90 שניות
        run: |
          want=$(sha256sum check.html | cut -d' ' -f1)
          for i in $(seq 1 30); do
            got=$(curl -s "https://bodek-eight.vercel.app/check.html?v=$i" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && { echo "האתר החי מעודכן (ניסיון $i)"; exit 0; }
            sleep 10
          done
          echo "::warning::האתר החי לא התעדכן תוך 5 דקות. הבדיקה רצה מול הגרסה הקודמת"
      - name: בדיקת האתר החי (הכלי)
        if: always()
        shell: pwsh
        run: ./qa/run-suite.ps1 -Target live
      - name: בדיקת האתר החי (דף הכניסה)
        if: always()
        shell: pwsh
        run: ./qa/run-suite.ps1 -Target live -PageFile index.html
      - name: בדיקת האתר החי (דף ניהול העדכונים)
        if: always()
        shell: pwsh
        run: ./qa/run-suite.ps1 -Target live -PageFile admin.html
